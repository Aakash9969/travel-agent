<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Travel Agent — autonomous trip concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14100D;
    --bg-soft: #1B1612;
    --glass: rgba(248, 240, 228, 0.045);
    --glass-strong: rgba(248, 240, 228, 0.07);
    --line: rgba(248, 240, 228, 0.1);
    --line-soft: rgba(248, 240, 228, 0.06);
    --text: #F2EBDF;
    --text-dim: #A99F92;
    --text-faint: #7A7267;
    --gold: #E3A94B;
    --gold-bright: #F0BE63;
    --gold-soft: rgba(227, 169, 75, 0.14);
    --green: #85BE90;
    --green-soft: rgba(133, 190, 144, 0.14);
    --red: #E06A56;
    --red-soft: rgba(224, 106, 86, 0.12);
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    --font-ui: 'DM Sans', sans-serif;
    --font-display: 'Fraunces', serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 15px;
  }
  body::before {
    /* warm aurora glow behind everything */
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(52rem 30rem at 12% -8%, rgba(227, 169, 75, 0.09), transparent 60%),
      radial-gradient(44rem 28rem at 108% 108%, rgba(64, 105, 96, 0.13), transparent 60%),
      radial-gradient(30rem 22rem at 85% 0%, rgba(210, 120, 60, 0.05), transparent 55%);
  }

  .app {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(340px, 460px);
    grid-template-rows: auto auto minmax(0, 1fr);
    height: 100vh;
    padding: 16px 20px;
    gap: 16px;
  }

  /* ============ header ============ */
  header.top {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 16px;
    background: var(--glass);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 38px; height: 38px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #F0BE63, #C98A2C);
    border-radius: 12px;
    color: #201507;
    box-shadow: 0 4px 18px rgba(227, 169, 75, 0.25);
  }
  .logo svg { width: 20px; height: 20px; }
  .brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .brand .sub {
    display: block;
    font-size: 11.5px;
    color: var(--text-dim);
    letter-spacing: 0.4px;
  }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .model-pill {
    display: none;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .model-pill.show { display: inline-block; }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--text-dim);
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    min-width: 86px;
    justify-content: center;
  }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px var(--green-soft);
    flex: none;
  }
  .status.busy .dot {
    background: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-soft);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .ghost-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--text-faint); background: var(--glass); }
  .ghost-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ghost-btn svg { width: 14px; height: 14px; }

  /* ============ banner ============ */
  .banner {
    grid-column: 1 / -1;
    display: none;
    gap: 12px;
    align-items: flex-start;
    margin: 0 4px;
    border: 1px solid rgba(227, 169, 75, 0.35);
    background: linear-gradient(180deg, rgba(227, 169, 75, 0.1), rgba(227, 169, 75, 0.05));
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.55;
  }
  .banner.show { display: flex; }
  .banner svg { width: 17px; height: 17px; color: var(--gold); flex: none; margin-top: 1px; }
  .banner b { color: var(--text); font-weight: 600; }
  .banner ul { margin: 6px 0 0; padding-left: 16px; }
  .banner li { margin-bottom: 3px; }
  .banner code {
    font-family: var(--font-mono); font-size: 12px;
    background: var(--glass-strong); padding: 1px 6px; border-radius: 5px;
  }

  /* ============ chat ============ */
  .chat {
    display: flex;
    flex-direction: column;
    min-width: 0; min-height: 0;
    background: var(--glass);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    backdrop-filter: blur(14px);
    overflow: hidden;
  }
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
  }
  .thread-inner { width: 100%; max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .row { display: flex; gap: 12px; animation: rise 0.25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .avatar {
    width: 30px; height: 30px; flex: none;
    border-radius: 9px;
    display: grid; place-items: center;
    margin-top: 2px;
  }
  .avatar svg { width: 15px; height: 15px; }
  .avatar.agent { background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(227, 169, 75, 0.25); }
  .avatar.user { background: var(--glass-strong); color: var(--text-dim); border: 1px solid var(--line); }

  .row.user { justify-content: flex-end; }
  .row.user .bubble {
    background: var(--glass-strong);
    border: 1px solid var(--line);
    border-radius: 14px 14px 4px 14px;
    padding: 10px 15px;
    max-width: 78%;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .row.agent .name {
    font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 5px;
  }
  .row.agent .body { line-height: 1.65; font-size: 14.5px; min-width: 0; }
  .row.agent p { margin: 0 0 10px; }
  .row.agent p:last-child { margin-bottom: 0; }
  .row.agent ul, .row.agent ol { margin: 4px 0 10px; padding-left: 22px; }
  .row.agent li { margin-bottom: 4px; }
  .row.agent code {
    font-family: var(--font-mono); font-size: 12.5px;
    background: var(--glass-strong);
    border: 1px solid var(--line-soft);
    border-radius: 5px; padding: 1px 6px;
  }
  .row.agent strong { color: var(--gold-bright); font-weight: 600; }
  .row.agent a { color: var(--gold-bright); }

  .typing { display: inline-flex; gap: 5px; padding: 8px 0 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    animation: blink 1.15s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  /* empty state / hero */
  .hero { max-width: 560px; margin: 4% auto 0; text-align: left; }
  .hero .eyebrow {
    font-size: 11.5px; font-weight: 600; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 14px;
  }
  .hero h2 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(30px, 4.5vw, 44px);
    line-height: 1.1;
    margin: 0 0 14px;
    color: var(--text);
  }
  .hero p { color: var(--text-dim); line-height: 1.65; margin: 0 0 26px; max-width: 480px; }
  .chips { display: grid; gap: 10px; }
  .chip {
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    background: var(--glass);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13.5px;
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .chip svg { width: 16px; height: 16px; color: var(--gold); flex: none; }
  .chip:hover { border-color: rgba(227, 169, 75, 0.4); color: var(--text); background: var(--glass-strong); }

  /* composer */
  .composer {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--line-soft);
    background: var(--glass);
  }
  .composer textarea {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.45;
    padding: 12px 16px;
    border-radius: 12px;
    resize: none;
    height: 46px;
    max-height: 150px;
    transition: border-color 0.2s;
  }
  .composer textarea::placeholder { color: var(--text-faint); }
  .composer textarea:focus { outline: none; border-color: rgba(227, 169, 75, 0.55); }
  .composer textarea:disabled { opacity: 0.5; }
  .send-btn {
    width: 46px; height: 46px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #F0BE63, #C98A2C);
    color: #201507;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: filter 0.2s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(227, 169, 75, 0.28);
  }
  .send-btn svg { width: 18px; height: 18px; margin-left: 2px; }
  .send-btn:hover { filter: brightness(1.08); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.45; cursor: not-allowed; filter: saturate(0.4); }

  /* ============ console ============ */
  .console {
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-right: 2px;
  }
  .card {
    background: var(--glass);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    backdrop-filter: blur(14px);
    flex: none;
  }
  .card-head {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .card-head svg { width: 15px; height: 15px; color: var(--gold); flex: none; }
  .card-head h3 {
    margin: 0;
    font-size: 11.5px; font-weight: 600;
    letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--text-dim);
    flex: 1;
  }
  .live-badge {
    display: none;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--gold);
    padding: 2px 8px;
    border: 1px solid rgba(227, 169, 75, 0.4);
    border-radius: 999px;
  }
  .live-badge.show { display: inline-block; animation: pulse 1.2s infinite; }
  .card-body { padding: 14px 16px 16px; }

  /* memory */
  .mem-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .mem-chip {
    background: var(--glass-strong);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 8px 11px;
    min-width: 0;
  }
  .mem-chip .k {
    font-size: 10.5px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mem-chip .v {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trips-title {
    font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-faint);
    margin: 14px 0 8px;
  }
  .trip-row { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 13px; }
  .trip-row svg { width: 13px; height: 13px; color: var(--gold); flex: none; }
  .trip-row .dest { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trip-row .meta { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .trips-none { font-size: 12.5px; color: var(--text-faint); }

  /* approval */
  .approval-card { border-color: rgba(227, 169, 75, 0.45); box-shadow: 0 0 0 1px rgba(227, 169, 75, 0.12), var(--shadow); }
  .approval-card .card-head h3 { color: var(--gold); }
  .ap-title {
    font-family: var(--font-display); font-style: italic; font-weight: 600;
    font-size: 19px; margin: 0 0 12px;
  }
  .ap-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 13.5px; }
  .ap-row svg { width: 15px; height: 15px; color: var(--text-dim); flex: none; margin-top: 2px; }
  .ap-row .label { color: var(--text-dim); width: 88px; flex: none; font-size: 12px; letter-spacing: 0.4px; text-transform: uppercase; }
  .ap-row .val { color: var(--text); line-height: 1.5; min-width: 0; }
  .ap-total .val { color: var(--gold-bright); font-family: var(--font-mono); font-weight: 500; }
  .ap-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn-approve, .btn-decline {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 0;
    border-radius: 12px;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s, transform 0.15s, background 0.2s, border-color 0.2s;
  }
  .btn-approve {
    background: linear-gradient(135deg, #85BE90, #4E8A5C);
    color: #0A1A0E;
    border: none;
  }
  .btn-approve:hover { filter: brightness(1.08); }
  .btn-approve:active, .btn-decline:active { transform: scale(0.98); }
  .btn-decline {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }
  .btn-decline:hover { color: var(--text); border-color: var(--text-faint); }
  .btn-approve:disabled, .btn-decline:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-approve svg, .btn-decline svg { width: 15px; height: 15px; }

  /* activity log */
  .act-list { display: flex; flex-direction: column; gap: 9px; max-height: 430px; overflow-y: auto; padding-right: 2px; }
  .act {
    display: flex; gap: 11px;
    background: var(--glass-strong);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    animation: rise 0.2s ease-out;
  }
  .act .rail {
    width: 8px; height: 8px; border-radius: 50%;
    margin-top: 5px; flex: none;
    background: var(--text-faint);
  }
  .act.tool_call .rail { background: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .act.observation .rail { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .act.error .rail { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .act .main { min-width: 0; flex: 1; }
  .act .kind { font-size: 10.5px; letter-spacing: 0.7px; text-transform: uppercase; color: var(--text-faint); }
  .act .name { font-family: var(--font-mono); font-size: 12.5px; color: var(--text); margin-top: 1px; }
  .act.error .name { color: var(--red); font-family: var(--font-ui); font-size: 12.5px; line-height: 1.5; }
  .act details { margin-top: 5px; }
  .act summary {
    list-style: none;
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--text-faint);
    cursor: pointer;
    width: fit-content;
  }
  .act summary:hover { color: var(--text-dim); }
  .act summary::before { content: "+ "; }
  .act details[open] summary::before { content: "- "; }
  .act pre {
    margin: 6px 0 2px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    white-space: pre-wrap; word-break: break-word;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    max-height: 180px;
    overflow-y: auto;
  }
  .act-empty { font-size: 12.5px; color: var(--text-faint); line-height: 1.6; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(248, 240, 228, 0.12); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(248, 240, 228, 0.22); border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* focus + motion */
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .thread { scroll-behavior: auto; }
  }

  /* ============ responsive ============ */
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(420px, 62vh) auto; height: auto; min-height: 100vh; }
    body { font-size: 14.5px; }
    .console { overflow: visible; }
    .hero { margin: 2% auto 0; }
  }
  @media (max-width: 560px) {
    .app { padding: 10px; gap: 10px; }
    .brand h1 { font-size: 14px; }
    .model-pill { display: none; }
    .row.user .bubble { max-width: 92%; }
    .hero h2 { font-size: 30px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </div>
      <div class="titles">
        <h1>Travel Agent</h1>
        <span class="sub">autonomous trip concierge</span>
      </div>
    </div>
    <div class="top-right">
      <span class="model-pill" id="modelPill" title="Active model"></span>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">idle</span></div>
      <button class="ghost-btn" id="resetBtn" title="Start a fresh conversation — your memory is kept">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <div class="banner" id="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <div id="bannerContent"></div>
  </div>

  <main class="chat">
    <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Plan a trip from Bangalore to Goa, Dec 10–13, budget $400…" aria-label="Your message to the agent" autocomplete="off"></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </form>
  </main>

  <aside class="console">
    <section class="card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
        <h3>Memory</h3>
      </div>
      <div class="card-body">
        <div class="mem-grid" id="memory"></div>
        <div id="trips"></div>
      </div>
    </section>

    <section class="card approval-card" id="approvalPanel" hidden>
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <h3>Approval needed</h3>
      </div>
      <div class="card-body" id="approvalBody"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <h3>Agent activity</h3>
        <span class="live-badge" id="liveBadge">live</span>
      </div>
      <div class="card-body">
        <div class="act-list" id="activity" role="log" aria-live="polite">
          <div class="act-empty" id="actEmpty">The agent's tool calls and results will appear here in real time — flights, hotels, weather, memory writes.</div>
        </div>
      </div>
    </section>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const thread = $('thread');
const threadInner = $('threadInner');
const activityLog = $('activity');
const actEmpty = $('actEmpty');
const memoryGrid = $('memory');
const tripsEl = $('trips');
const approvalPanel = $('approvalPanel');
const approvalBody = $('approvalBody');
const statusEl = $('status');
const statusText = $('statusText');
const liveBadge = $('liveBadge');
const banner = $('banner');
const bannerContent = $('bannerContent');
const modelPill = $('modelPill');
const composer = $('composer');
const input = $('input');
const sendBtn = $('sendBtn');
const resetBtn = $('resetBtn');

let busy = false;
let typingRow = null;
let busyTimer = null;
const busyStart = null;

const ICONS = {
  agent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  plane: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7L9 12l-3 5H3l1 2 2-1 5 3 4.3-7.1.4 1.8 2 2 1.4-1.4z"/></svg>',
  bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
};

/* ---------- utils ---------- */

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '\u0026amp;',
    '<': '\u0026lt;',
    '>': '\u0026gt;',
    '"': '\u0026quot;',
    "'": '\u0026#39;'
  })[c]);
}

// Minimal, safe markdown: escape first, then bold/code/links/lists.
function renderMarkdown(src) {
  const inline = t => t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])((https?):\/\/[^\s<)]+)/g,
      (m, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const raw of escapeHtml(src.trim()).split('\n')) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    const ul = line.match(/^[-*]\s+(.*)/);
    const ol = line.match(/^(\d+)[.)]\s+(.*)/);
    if (ul) {
      if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>');
    } else if (ol) {
      if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + inline(ol[2]) + '</li>');
    } else {
      closeList();
      out.push('<p>' + inline(line) + '</p>');
    }
  }
  closeList();
  return out.join('');
}

function nearBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 130;
}
function keepScroll(el) { el.scrollTop = el.scrollHeight; }

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

/* ---------- chat thread ---------- */

function showHero() {
  const div = document.createElement('div');
  div.className = 'hero';
  div.id = 'hero';
  div.innerHTML = `
    <div class="eyebrow">Your AI travel desk</div>
    <h2>Where to next?</h2>
    <p>Tell me where you'd like to go. I'll search real flights and hotels, check the live
    weather, respect your budget and remembered preferences, and propose a complete plan —
    you approve it before anything is booked.</p>
    <div class="chips">
      <button class="chip">${ICONS.plane}<span>Plan a 3-day trip from Bangalore to Goa starting Dec 10, budget around $400</span></button>
      <button class="chip">${ICONS.sun}<span>Find a weekend trip from Delhi with good weather and a 4-star hotel</span></button>
      <button class="chip">${ICONS.bed}<span>Check the weather in Paris around Nov 20, then plan 2 days there</span></button>
    </div>`;
  div.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      if (busy) return;
      input.value = chip.textContent.trim();
      composer.requestSubmit();
    });
  });
  threadInner.appendChild(div);
}

function hideHero() {
  const el = $('hero');
  if (el) el.remove();
}

function addUserMessage(text) {
  hideHero();
  const stick = nearBottom(thread);
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble"></div>`;
  row.querySelector('.bubble').textContent = text;
  threadInner.appendChild(row);
  if (stick) keepScroll(thread);
}

function addAgentMessage(text) {
  hideHero();
  const stick = nearBottom(thread);
  const row = document.createElement('div');
  row.className = 'row agent';
  row.innerHTML = `
    <div class="avatar agent" aria-hidden="true">${ICONS.agent}</div>
    <div class="main">
      <div class="name">Agent</div>
      <div class="body">${renderMarkdown(text)}</div>
    </div>`;
  threadInner.appendChild(row);
  if (stick) keepScroll(thread);
}

function showTyping() {
  hideTyping();
  const stick = nearBottom(thread);
  typingRow = document.createElement('div');
  typingRow.className = 'row agent';
  typingRow.innerHTML = `
    <div class="avatar agent" aria-hidden="true">${ICONS.agent}</div>
    <div class="main"><div class="name">Agent</div><div class="typing"><span></span><span></span><span></span></div></div>`;
  threadInner.appendChild(typingRow);
  if (stick) keepScroll(thread);
}
function hideTyping() {
  if (typingRow) { typingRow.remove(); typingRow = null; }
}

/* ---------- panels ---------- */

function renderMemory(mem) {
  mem = mem || {};
  memoryGrid.innerHTML = '';
  const entries = Object.entries(mem).filter(([k]) => k !== 'past_trips');
  if (!entries.length) {
    memoryGrid.innerHTML = '<div class="trips-none">Nothing learned yet — preferences appear here as the agent gets to know you.</div>';
  }
  for (const [k, v] of entries) {
    const chip = document.createElement('div');
    chip.className = 'mem-chip';
    chip.title = k + ': ' + (v ?? '');
    const shown = (v === null || v === undefined || v === '') ? '—' : v;
    chip.innerHTML = `<div class="k"></div><div class="v"></div>`;
    chip.querySelector('.k').textContent = k;
    chip.querySelector('.v').textContent = shown;
    memoryGrid.appendChild(chip);
  }
  const trips = mem.past_trips || [];
  tripsEl.innerHTML = '<div class="trips-title">Past trips</div>';
  if (!trips.length) {
    tripsEl.insertAdjacentHTML('beforeend', '<div class="trips-none">No trips booked yet.</div>');
    return;
  }
  for (const trip of trips.slice(-5).reverse()) {
    const row = document.createElement('div');
    row.className = 'trip-row';
    row.innerHTML = `${ICONS.pin}<span class="dest"></span><span class="meta"></span>`;
    row.querySelector('.dest').textContent = trip.destination || '?';
    row.querySelector('.meta').textContent =
      (trip.total_cost || '?') + ' · ' + (trip.logged_at || '').slice(0, 10);
    tripsEl.appendChild(row);
  }
}

function addActivity(item) {
  if (actEmpty) actEmpty.remove();
  const stick = nearBottom(activityLog);
  const el = document.createElement('div');
  el.className = 'act ' + item.type;
  const json = item.input !== undefined ? item.input : item.result;
  const label = item.type === 'tool_call' ? 'calling tool'
              : item.type === 'observation' ? 'result' : 'error';
  if (item.type === 'error') {
    el.innerHTML = `<span class="rail"></span><div class="main"><div class="kind">error</div><div class="name"></div></div>`;
    el.querySelector('.name').textContent = item.content;
  } else {
    el.innerHTML = `
      <span class="rail"></span>
      <div class="main">
        <div class="kind"></div>
        <div class="name"></div>
        <details><summary>details</summary><pre></pre></details>
      </div>`;
    el.querySelector('.kind').textContent = label;
    el.querySelector('.name').textContent = item.name;
    el.querySelector('pre').textContent = JSON.stringify(json, null, 2);
  }
  activityLog.appendChild(el);
  if (stick) keepScroll(activityLog);
}

function clearActivity() {
  activityLog.innerHTML = '<div class="act-empty" id="actEmpty">The agent\u2019s tool calls and results will appear here in real time — flights, hotels, weather, memory writes.</div>';
}

function showApproval(pending) {
  approvalPanel.hidden = false;
  const rows = [
    ['pin', 'Where', pending.destination],
    ['cal', 'When', fmtDate(pending.start_datetime) + '  →  ' + fmtDate(pending.end_datetime)],
    ['plane', 'Flight', pending.flight_summary],
    ['bed', 'Hotel', pending.hotel_summary],
  ];
  approvalBody.innerHTML = `
    <div class="ap-title"></div>
    ${rows.map(([icon, label, val]) => `
      <div class="ap-row">${ICONS[icon]}<span class="label">${label}</span><span class="val"></span></div>
    `).join('')}
    <div class="ap-row ap-total">${ICONS.check}<span class="label">Total</span><span class="val"></span></div>
    <div class="ap-actions">
      <button class="btn-approve" id="approveBtn">${ICONS.check}<span>Approve booking</span></button>
      <button class="btn-decline" id="declineBtn">${ICONS.x}<span>Decline</span></button>
    </div>`;
  approvalBody.querySelector('.ap-title').textContent = pending.title || 'Finalize trip';
  const vals = approvalBody.querySelectorAll('.ap-row .val');
  vals[0].textContent = pending.destination || '—';
  vals[1].textContent = fmtDate(pending.start_datetime) + '  →  ' + fmtDate(pending.end_datetime);
  vals[2].textContent = pending.flight_summary || '—';
  vals[3].textContent = pending.hotel_summary || '—';
  vals[4].textContent = pending.total_cost || '—';
  $('approveBtn').onclick = () => respondApproval(true);
  $('declineBtn').onclick = () => respondApproval(false);
}

function hideApproval() {
  approvalPanel.hidden = true;
  approvalBody.innerHTML = '';
}

/* ---------- streaming ---------- */

// Reads a newline-delimited-JSON stream from the backend, handling each
// event as it arrives so the UI updates in real time while the agent works.
async function streamNDJSON(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok && !res.body) throw new Error('HTTP ' + res.status);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (line) handleEvent(JSON.parse(line));
    }
  }
}

function handleEvent(evt) {
  hideTyping();
  switch (evt.type) {
    case 'text':
      addAgentMessage(evt.content);
      break;
    case 'tool_call':
    case 'observation':
      addActivity(evt);
      if (evt.memory) renderMemory(evt.memory);
      break;
    case 'error':
      addActivity(evt);
      break;
    case 'approval_required':
      showApproval(evt.pending_approval || {});
      if (evt.memory) renderMemory(evt.memory);
      break;
    case 'done':
      renderMemory(evt.memory);
      if (!evt.pending_approval) hideApproval();
      setBusy(false);
      break;
  }
}

let busySince = null;
function setBusy(b) {
  busy = b;
  statusEl.classList.toggle('busy', b);
  liveBadge.classList.toggle('show', b);
  sendBtn.disabled = b;
  input.disabled = b;
  resetBtn.disabled = b;
  if (b) {
    busySince = Date.now();
    statusText.textContent = 'thinking…';
    busyTimer = setInterval(() => {
      const s = Math.round((Date.now() - busySince) / 1000);
      statusText.textContent = 'thinking… ' + s + 's';
    }, 1000);
  } else {
    clearInterval(busyTimer);
    busyTimer = null;
    statusText.textContent = 'idle';
  }
}

/* ---------- actions ---------- */

async function respondApproval(approved) {
  setBusy(true);
  hideApproval();
  showTyping();
  try {
    await streamNDJSON('/api/approve', { approved });
  } catch (err) {
    addActivity({ type: 'error', content: String(err) });
  } finally {
    hideTyping();
    setBusy(false);
  }
}

composer.addEventListener('submit', async e => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || busy) return;
  addUserMessage(message);
  input.value = '';
  input.style.height = 'auto';
  setBusy(true);
  showTyping();
  try {
    await streamNDJSON('/api/chat', { message });
  } catch (err) {
    addActivity({ type: 'error', content: String(err) });
  } finally {
    hideTyping();
    setBusy(false);
  }
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    composer.requestSubmit();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});

resetBtn.addEventListener('click', async () => {
  if (busy) return;
  await fetch('/api/reset', { method: 'POST' });
  threadInner.innerHTML = '';
  clearActivity();
  hideApproval();
  showHero();
  fetch('/api/memory').then(r => r.json()).then(renderMemory).catch(() => {});
});

/* ---------- boot ---------- */

showHero();

fetch('/api/memory').then(r => r.json()).then(renderMemory).catch(() => {});

fetch('/api/config').then(r => r.json()).then(cfg => {
  if (cfg.provider && cfg.model) {
    modelPill.textContent = cfg.provider + ' · ' + cfg.model;
    modelPill.title = 'Active provider and model: ' + cfg.provider + ' / ' + cfg.model;
    modelPill.classList.add('show');
  }
  const hasLLM = cfg.anthropic_key_set || cfg.nvidia_key_set || cfg.openai_key_set;
  const warns = [];
  if (!hasLLM) {
    warns.push('No LLM provider configured — the agent cannot run. Add <code>NVIDIA_API_KEY</code> or <code>ANTHROPIC_API_KEY</code> to <b>.env</b> and restart the server.');
  }
  if (!cfg.amadeus_keys_set) {
    warns.push('Amadeus keys are not set — flight and hotel search will fail. Add <code>AMADEUS_CLIENT_ID</code> and <code>AMADEUS_CLIENT_SECRET</code> to <b>.env</b> (free at developers.amadeus.com).');
  }
  if (warns.length) {
    bannerContent.innerHTML = warns.map(w => '<div>' + w + '</div>').join('');
    banner.classList.add('show');
  }
}).catch(() => {});
</script>
</body>
</html>
